name: Feature Request
description: 新機能のリクエスト
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どんな機能がほしいか、簡潔に説明してください
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: なぜこの機能が必要なのか
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 完了条件
      description: この機能が「完了」と言える条件
  - type: textarea
    id: technical-notes
    attributes:
      label: 技術メモ
      description: 実装に関するヒントや制約
